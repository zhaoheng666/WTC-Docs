<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>304 Sweet Gala AI 关卡蓝图</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f8;
      --surface: #ffffff;
      --surface-soft: #eef2f3;
      --surface-strong: #e3e9eb;
      --text: #20272b;
      --muted: #657077;
      --line: #d2dade;
      --line-strong: #aebbc1;
      --focus: #1f6d8b;
      --series-1: #206b55;
      --series-1-soft: #e1f0e9;
      --series-2: #256b91;
      --series-2-soft: #e1edf4;
      --series-3: #855b22;
      --series-3-soft: #f3eadb;
      --series-4: #8f454d;
      --series-4-soft: #f5e5e7;
      --series-5: #66549a;
      --series-5-soft: #ebe7f5;
      --series-6: #34777c;
      --series-6-soft: #e2eff0;
      --danger: #9b3038;
      --danger-soft: #f8e5e6;
      --warning: #8b631d;
      --warning-soft: #f7edda;
      --ok: #256b4a;
      --ok-soft: #e2f0e8;
      --shadow: 0 10px 28px rgba(32, 47, 54, 0.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #171b1d;
        --surface: #202629;
        --surface-soft: #293034;
        --surface-strong: #333c40;
        --text: #edf1f2;
        --muted: #a9b4b9;
        --line: #3d484d;
        --line-strong: #66757b;
        --focus: #74bdd9;
        --series-1: #78c3a4;
        --series-1-soft: #243e34;
        --series-2: #78b7d8;
        --series-2-soft: #253d49;
        --series-3: #d4ae68;
        --series-3-soft: #443822;
        --series-4: #dd9097;
        --series-4-soft: #472c30;
        --series-5: #b1a0df;
        --series-5-soft: #38314c;
        --series-6: #79c0c4;
        --series-6-soft: #294044;
        --danger: #f1a1a7;
        --danger-soft: #4a292d;
        --warning: #e2c27e;
        --warning-soft: #463b27;
        --ok: #8ed2b0;
        --ok-soft: #274237;
        --shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    button,
    select {
      font: inherit;
    }

    button:focus-visible,
    select:focus-visible,
    a:focus-visible,
    summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    a {
      color: inherit;
    }

    code {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface-soft);
      padding: 1px 4px;
      font-family: Menlo, Consolas, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
      letter-spacing: 0;
    }

    h1 {
      margin-bottom: 3px;
      font-size: 24px;
      font-weight: 500;
    }

    h2 {
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: 500;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    .page {
      width: min(1540px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 18px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--line);
    }

    .subtitle,
    .muted {
      color: var(--muted);
    }

    .doc-links,
    .control-group,
    .legend,
    .tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .doc-links {
      justify-content: flex-end;
    }

    .doc-links a,
    .control-button,
    .flow-select {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      padding: 6px 10px;
      text-decoration: none;
      cursor: pointer;
    }

    .control-button[aria-pressed="true"] {
      border-color: var(--text);
      background: var(--text);
      color: var(--bg);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0;
    }

    .metric {
      min-height: 76px;
      border-left: 3px solid var(--series-2);
      background: var(--surface);
      padding: 11px 12px;
      box-shadow: var(--shadow);
    }

    .metric:nth-child(2) { border-left-color: var(--series-1); }
    .metric:nth-child(3) { border-left-color: var(--series-5); }
    .metric:nth-child(4) { border-left-color: var(--series-3); }
    .metric:nth-child(5) { border-left-color: var(--series-4); }
    .metric:nth-child(6) { border-left-color: var(--series-6); }

    .metric strong {
      display: block;
      font-size: 22px;
      font-weight: 500;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .workspace {
      margin: 0 -22px 20px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .workspace-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 13px 22px;
      border-bottom: 1px solid var(--line);
    }

    .workspace-toolbar .right-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 9px;
    }

    .legend {
      padding: 9px 22px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .swatch {
      width: 11px;
      height: 11px;
      border-radius: 2px;
      background: var(--line-strong);
    }

    .swatch.process { background: var(--series-2); }
    .swatch.action { background: var(--series-1); }
    .swatch.entity { background: var(--series-5); }
    .swatch.protocol { background: var(--series-3); }
    .swatch.presentation { background: var(--series-4); }
    .swatch.gate { background: var(--series-6); }

    .workspace-view {
      padding: 16px 22px 8px;
    }

    .workspace-view[hidden] {
      display: none;
    }

    .timeline-axis,
    .timeline-lane {
      display: grid;
      grid-template-columns: 118px repeat(10, minmax(0, 1fr));
    }

    .timeline-axis {
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid var(--line-strong);
      background: var(--surface);
    }

    .axis-corner,
    .axis-stage,
    .lane-label,
    .timeline-cell {
      min-width: 0;
      border-right: 1px solid var(--line);
    }

    .axis-stage,
    .axis-corner {
      min-height: 46px;
      padding: 8px 6px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .axis-stage strong {
      display: block;
      color: var(--text);
      font-weight: 500;
    }

    .timeline-lane {
      border-bottom: 1px solid var(--line);
    }

    .lane-label {
      padding: 9px;
      background: var(--surface-soft);
      font-weight: 500;
    }

    .timeline-cell {
      position: relative;
      min-height: 96px;
      padding: 5px;
      background-image: linear-gradient(to bottom, transparent 49%, var(--line) 50%, transparent 51%);
      background-size: 100% 24px;
    }

    .timeline-node,
    .graph-node {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 5px;
      color: var(--text);
      text-align: left;
      cursor: pointer;
      overflow-wrap: anywhere;
    }

    .timeline-node {
      position: relative;
      z-index: 1;
      display: block;
      min-height: 38px;
      margin-bottom: 5px;
      padding: 5px 6px;
      background: var(--surface-soft);
      font-size: 11px;
    }

    .timeline-node::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      border-radius: 4px 0 0 4px;
      background: var(--line-strong);
    }

    .timeline-node.kind-process::before { background: var(--series-2); }
    .timeline-node.kind-action::before { background: var(--series-1); }
    .timeline-node.kind-hook::before { background: var(--series-5); }
    .timeline-node.kind-state::before,
    .timeline-node.kind-cleanup::before { background: var(--series-3); }
    .timeline-node.kind-presentation::before,
    .timeline-node.kind-popup::before { background: var(--series-4); }
    .timeline-node.kind-gate::before { background: var(--series-6); }

    .timeline-node .node-id {
      display: block;
      color: var(--muted);
      font-family: Menlo, Consolas, monospace;
      font-size: 10px;
    }

    .timeline-node.is-selected,
    .graph-node.is-selected {
      border-color: var(--focus);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 28%, transparent);
    }

    .timeline-node.is-muted,
    .graph-node.is-muted {
      opacity: 0.22;
    }

    .mobile-timeline {
      display: none;
    }

    .graph-canvas {
      position: relative;
      min-height: 880px;
      isolation: isolate;
    }

    .graph-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 112px repeat(8, minmax(0, 1fr));
      align-items: stretch;
    }

    .graph-phase,
    .graph-corner,
    .graph-lane-label,
    .graph-cell {
      min-width: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .graph-corner,
    .graph-phase {
      min-height: 44px;
      padding: 8px 5px;
      background: var(--surface);
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .graph-phase strong {
      display: block;
      color: var(--text);
      font-weight: 500;
    }

    .graph-lane-label {
      padding: 9px;
      background: var(--surface-soft);
      font-weight: 500;
    }

    .graph-cell {
      min-height: 134px;
      padding: 5px;
    }

    .graph-node {
      position: relative;
      display: block;
      min-height: 50px;
      margin-bottom: 6px;
      padding: 0;
      background: var(--surface);
      box-shadow: 0 2px 6px rgba(26, 40, 47, 0.09);
    }

    .graph-node-header {
      display: block;
      min-height: 23px;
      padding: 4px 7px;
      border-radius: 4px 4px 0 0;
      background: var(--surface-strong);
      font-size: 10px;
      font-family: Menlo, Consolas, monospace;
    }

    .graph-node.type-process .graph-node-header { background: var(--series-2-soft); border-top: 3px solid var(--series-2); }
    .graph-node.type-action .graph-node-header { background: var(--series-1-soft); border-top: 3px solid var(--series-1); }
    .graph-node.type-entity .graph-node-header { background: var(--series-5-soft); border-top: 3px solid var(--series-5); }
    .graph-node.type-protocol .graph-node-header { background: var(--series-3-soft); border-top: 3px solid var(--series-3); }
    .graph-node.type-presentation .graph-node-header { background: var(--series-4-soft); border-top: 3px solid var(--series-4); }
    .graph-node.type-gate .graph-node-header { background: var(--series-6-soft); border-top: 3px solid var(--series-6); }

    .graph-node-title {
      display: block;
      padding: 6px 7px 7px;
      font-size: 11px;
      font-weight: 500;
    }

    .pin {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--line-strong);
      transform: translateY(-50%);
    }

    .pin.input { left: -5px; }
    .pin.output { right: -5px; }

    .graph-edges {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .graph-edge {
      fill: none;
      stroke: var(--line-strong);
      stroke-width: 1.4;
      opacity: 0.42;
    }

    .graph-edge.edge-control,
    .graph-edge.edge-branch { stroke: var(--series-2); }
    .graph-edge.edge-read { stroke: var(--series-3); stroke-dasharray: 4 3; }
    .graph-edge.edge-write { stroke: var(--series-5); }
    .graph-edge.edge-render { stroke: var(--series-4); stroke-dasharray: 2 3; }
    .graph-edge.edge-cleanup { stroke: var(--danger); }
    .graph-edge.edge-verify { stroke: var(--series-6); stroke-dasharray: 6 3; }
    .graph-edge.is-active { stroke-width: 2.6; opacity: 0.95; }
    .graph-edge.is-muted { opacity: 0.06; }

    .selected-detail {
      display: grid;
      grid-template-columns: minmax(180px, 0.8fr) minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 14px;
      min-height: 122px;
      margin: 10px 22px 18px;
      border-top: 1px solid var(--line);
      padding-top: 13px;
    }

    .detail-block {
      min-width: 0;
    }

    .detail-label {
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
    }

    .detail-title {
      font-size: 15px;
      font-weight: 500;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 23px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface-soft);
      padding: 2px 6px;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .review-list {
      display: grid;
      gap: 0;
      border-top: 1px solid var(--line);
    }

    .review-row {
      display: grid;
      grid-template-columns: 110px minmax(190px, 0.8fr) minmax(280px, 1.3fr) 100px 86px;
      gap: 10px;
      align-items: start;
      padding: 11px 6px;
      border-bottom: 1px solid var(--line);
    }

    .status {
      display: inline-flex;
      width: fit-content;
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 11px;
    }

    .status.resolved { background: var(--ok-soft); color: var(--ok); }
    .status.must-fix { background: var(--danger-soft); color: var(--danger); }
    .status.compat { background: var(--warning-soft); color: var(--warning); }

    .section {
      margin: 24px 0;
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 7px;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 13px;
    }

    .panel-item {
      min-width: 0;
      border-left: 4px solid var(--series-6);
      background: var(--surface);
      padding: 12px;
    }

    .panel-board {
      display: grid;
      gap: 3px;
      width: 100%;
      max-width: 420px;
      margin-top: 10px;
    }

    .panel-cell {
      aspect-ratio: 1.45;
      min-height: 18px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: var(--series-2-soft);
    }

    .panel-board.base .panel-cell { background: var(--series-1-soft); }
    .panel-board.super .panel-cell:nth-child(n + 16) { background: var(--series-5-soft); }

    .pipeline {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 0;
      margin-top: 13px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .pipeline-step {
      position: relative;
      min-height: 96px;
      border-right: 1px solid var(--line);
      padding: 10px 8px;
    }

    .pipeline-step:last-child { border-right: 0; }

    .pipeline-step strong {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .pipeline-step span {
      color: var(--muted);
      font-size: 11px;
    }

    .pipeline-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      margin-bottom: 6px;
      border-radius: 50%;
      background: var(--text);
      color: var(--bg);
      font-size: 11px;
    }

    details.reference-group {
      border-bottom: 1px solid var(--line);
    }

    details.reference-group:first-of-type {
      border-top: 1px solid var(--line);
    }

    details.reference-group summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
      cursor: pointer;
      font-weight: 500;
    }

    details.reference-group summary span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .table-scroll {
      overflow-x: auto;
      overscroll-behavior-inline: contain;
      padding-bottom: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    .table-scroll table {
      min-width: 820px;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--surface-soft);
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    td {
      font-size: 12px;
    }

    .entity-list,
    .protocol-list,
    .resource-list,
    .config-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 4px 0 14px;
    }

    .reference-item {
      min-width: 0;
      border-left: 3px solid var(--line-strong);
      background: var(--surface);
      padding: 9px 10px;
    }

    .reference-item p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1120px) {
      .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .pipeline { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      .pipeline-step:nth-child(5n) { border-right: 0; }
      .entity-list,
      .protocol-list,
      .resource-list,
      .config-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .selected-detail { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 900px) {
      .desktop-timeline { display: none; }
      .mobile-timeline { display: grid; gap: 8px; }
      .mobile-timeline .timeline-node { min-height: 48px; }
      .graph-edges { display: none; }
      .graph-grid { display: block; }
      .graph-corner,
      .graph-phase { display: none; }
      .graph-lane-label {
        border-right: 0;
        padding: 10px 4px 6px;
        background: transparent;
      }
      .graph-cell {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px;
        min-height: 0;
        border-right: 0;
        padding: 6px 0;
      }
      .graph-node { margin-bottom: 0; }
      .graph-canvas { min-height: 0; }
      .review-row { grid-template-columns: 100px 1fr; }
      .review-row > :nth-child(3),
      .review-row > :nth-child(4),
      .review-row > :nth-child(5) { grid-column: 2; }
    }

    @media (max-width: 720px) {
      .page { padding: 14px; }
      .topbar { grid-template-columns: 1fr; }
      .doc-links { justify-content: flex-start; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workspace { margin-right: -14px; margin-left: -14px; }
      .workspace-toolbar { grid-template-columns: 1fr; padding: 12px 14px; }
      .workspace-toolbar .right-controls { justify-content: flex-start; }
      .legend,
      .workspace-view { padding-right: 14px; padding-left: 14px; }
      .selected-detail { grid-template-columns: 1fr; margin-right: 14px; margin-left: 14px; }
      .panel-grid { grid-template-columns: 1fr; }
      .pipeline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .pipeline-step,
      .pipeline-step:nth-child(5n) { border-right: 1px solid var(--line); }
      .pipeline-step:nth-child(2n) { border-right: 0; }
      .entity-list,
      .protocol-list,
      .resource-list,
      .config-list { grid-template-columns: 1fr; }
      .graph-cell { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <main class="page">
    <header class="topbar">
      <div>
        <h1>304 Sweet Gala AI 关卡蓝图</h1>
        <div class="subtitle">证据、需求、实体、协议、完整时序、节点关系、代码产物与验收门禁</div>
      </div>
